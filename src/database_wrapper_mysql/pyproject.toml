[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "database_wrapper_mysql"
# Major.minor only; the patch comes from the release tags, stamped at build time by
# scripts/set_version.bash. See scripts/version.bash for what the next release is.
version = "0.4"
description = "database_wrapper for MySQL database"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gints Murans", email = "gm@gm.lv" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["database", "wrapper", "python", "mysql", "mariadb"]
# Floors only, no cap: an upper bound binds every project installing this package. Each
# floor clears all published security advisories; the database_wrapper pin is exact on purpose.
dependencies = ["database_wrapper == 0.4", "mysqlclient >= 2.2.2"]

[project.urls]
Homepage = "https://github.com/4Apps/py_database_wrapper"
Documentation = "https://github.com/4Apps/py_database_wrapper"
Changes = "https://github.com/4Apps/py_database_wrapper/blob/master/CHANGELOG.md"
Code = "https://github.com/4Apps/py_database_wrapper"
"Issue Tracker" = "https://github.com/4Apps/py_database_wrapper/issues"
Download = "https://pypi.org/project/database_wrapper/"

[tool.setuptools.package-data]
database_wrapper_mysql = ["py.typed"]
